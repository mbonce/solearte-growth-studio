<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 02 Approval State Gap</title>
  <desc id="desc">Internal-only editorial poster showing approval-state gaps with fake rows, bold labels, and founder-gated CTA handling.</desc>
  <rect width="1254" height="1254" fill="#f4efe6"/>
  <rect x="0" y="0" width="1254" height="240" fill="#111111"/>
  <polygon points="0,1240 0,760 540,520 826,1240" fill="#ff5a36"/>
  <circle cx="1088" cy="326" r="148" fill="#ffd84f"/>
  <rect x="72" y="74" width="228" height="58" rx="10" fill="#ffd84f" transform="rotate(-4 72 74)"/>
  <text x="92" y="114" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="30" letter-spacing="1">INTERNAL ONLY</text>
  <text x="80" y="392" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="126" letter-spacing="2">APPROVAL</text>
  <text x="80" y="500" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="126" letter-spacing="2">STATE</text>
  <text x="80" y="608" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="126" letter-spacing="2">GAP</text>
  <text x="86" y="668" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="34">Matched rows still need owner, reason, and next action.</text>

  <g transform="rotate(-6 744 408)">
    <rect x="620" y="254" width="520" height="248" rx="16" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="654" y="314" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">SPRING CATALOG A</text>
    <text x="654" y="356" fill="#ff5a36" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="44">REVIEWING</text>
    <text x="654" y="400" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Owner: M. Chen</text>
    <text x="654" y="438" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Reason: need rejection note</text>
    <text x="654" y="476" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Next: clarify supplier pack</text>
  </g>

  <g transform="rotate(4 776 676)">
    <rect x="558" y="542" width="560" height="270" rx="16" fill="#111111"/>
    <rect x="580" y="564" width="516" height="226" rx="12" fill="#fff8ef"/>
    <text x="616" y="626" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">SUMMER RESTOCK B</text>
    <text x="616" y="694" fill="#ff5a36" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="58">NEEDS OWNER REVIEW</text>
    <text x="616" y="742" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Owner: unassigned</text>
    <text x="616" y="778" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Reason: matched, but no approved-buy why</text>
    <text x="616" y="814" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Next: assign + decide</text>
  </g>

  <g transform="rotate(-3 928 972)">
    <rect x="740" y="866" width="390" height="210" rx="16" fill="#ffd84f" stroke="#111111" stroke-width="5"/>
    <text x="772" y="924" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">HOLIDAY CLOSEOUT C</text>
    <text x="772" y="982" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="50">APPROVED</text>
    <text x="772" y="1028" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28">Reason captured</text>
    <text x="772" y="1062" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28">Next: move to handoff</text>
  </g>

  <rect x="74" y="1116" width="1106" height="86" fill="#111111"/>
  <text x="96" y="1170" fill="#f4efe6" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="44">AUDIT THE GAP BEFORE THE NEXT SUPPLIER FILE LANDS.</text>
  <text x="96" y="1200" fill="#f4efe6" font-family="'Arial Narrow', Arial, sans-serif" font-size="22">Fake rows only. Founder-gated CTA. Not approved for posting, sending, or scheduling.</text>
</svg>
