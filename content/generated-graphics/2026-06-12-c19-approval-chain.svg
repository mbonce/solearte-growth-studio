<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 09 Approval Chain Stays With The Row</title>
  <desc id="desc">Internal-only editorial poster showing a fake wholesale catalog row moving through match, review receipt, reopen reason, and handoff-ready states while keeping the approval chain attached.</desc>
  <rect width="1254" height="1254" fill="#f6efe4"/>
  <rect x="0" y="0" width="1254" height="164" fill="#111111"/>
  <polygon points="0,1254 0,722 366,648 644,1254" fill="#0f6a73"/>
  <polygon points="820,124 1254,80 1254,452 904,530" fill="#ff6b35"/>
  <polygon points="944,868 1254,804 1254,1254 1042,1254" fill="#ffd44d"/>

  <rect x="76" y="64" width="324" height="58" rx="10" fill="#ffd44d" transform="rotate(-3 76 64)"/>
  <text x="98" y="104" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="28">CONTEXT MUST TRAVEL</text>

  <text x="78" y="314" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="124" letter-spacing="2">APPROVAL</text>
  <text x="78" y="420" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="124" letter-spacing="2">CHAIN</text>
  <text x="86" y="476" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="32">Match. Decision note. Review receipt. Reopen reason. Next owner.</text>

  <g transform="rotate(-6 848 288)">
    <rect x="566" y="176" width="578" height="212" rx="18" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="602" y="236" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27" font-weight="700">STEP 1  /  MATCH FOUND</text>
    <text x="602" y="308" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="58">NOT APPROVED YET</text>
    <text x="602" y="350" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28">ASIN matched. Supplier row still needs owner review and a decision note.</text>
  </g>

  <g transform="rotate(4 832 548)">
    <rect x="528" y="430" width="590" height="230" rx="18" fill="#111111"/>
    <rect x="552" y="454" width="542" height="182" rx="12" fill="#ff6b35"/>
    <text x="590" y="514" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27" font-weight="700">STEP 2  /  REVIEW RECEIPT</text>
    <text x="590" y="586" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="56">SAVE WHO CLEARED IT</text>
    <text x="590" y="626" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28">Reviewer: A. Lane  /  Decision: approved for small test buy</text>
  </g>

  <g transform="rotate(-4 420 900)">
    <rect x="132" y="780" width="514" height="238" rx="18" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="168" y="840" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27" font-weight="700">STEP 3  /  REOPEN REASON</text>
    <text x="168" y="912" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="54">SAVE WHAT CHANGED</text>
    <text x="168" y="954" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27">MOQ changed after supplier reply  /  Row returned to review with the trigger attached.</text>
  </g>

  <g transform="rotate(5 904 926)">
    <rect x="688" y="796" width="430" height="246" rx="18" fill="#111111"/>
    <rect x="712" y="820" width="382" height="198" rx="12" fill="#ffd44d"/>
    <text x="744" y="878" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700">STEP 4  /  HANDOFF READY</text>
    <text x="744" y="950" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="54">NEXT OWNER CLEAR</text>
    <text x="744" y="990" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="26">Owner: buying ops  /  Next action: place test PO</text>
  </g>

  <rect x="72" y="1122" width="1110" height="86" fill="#111111"/>
  <text x="98" y="1174" fill="#f6efe4" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="40">IF THE CHAIN BREAKS, THE NEXT OPERATOR HAS TO REBUILD THE SAME DECISION FROM MEMORY.</text>
  <text x="98" y="1203" fill="#f6efe4" font-family="'Arial Narrow', Arial, sans-serif" font-size="22">Fake rows only. Founder-gated CTA. Internal-only staging asset.</text>
</svg>
