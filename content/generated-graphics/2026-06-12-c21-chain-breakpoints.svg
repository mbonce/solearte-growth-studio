<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 11 Chain Breakpoints</title>
  <desc id="desc">Internal-only editorial poster showing fake wholesale workflow cards that mark the exact breakpoints where approval context drops out of the row.</desc>
  <rect width="1254" height="1254" fill="#f6ecdf"/>
  <rect x="0" y="0" width="1254" height="160" fill="#111111"/>
  <polygon points="0,1254 0,744 332,620 618,1254" fill="#0f6872"/>
  <polygon points="848,82 1254,36 1254,430 936,492" fill="#ff6c33"/>
  <polygon points="946,900 1254,840 1254,1254 1038,1254" fill="#ffd34a"/>

  <rect x="80" y="62" width="388" height="58" rx="10" fill="#ffd34a" transform="rotate(-2 80 62)"/>
  <text x="104" y="102" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="28">INTERNAL ONLY  /  FAKE ROWS  /  FOUNDER-GATED CTA</text>

  <text x="80" y="304" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="120" letter-spacing="2">CHAIN</text>
  <text x="80" y="414" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="120" letter-spacing="2">BREAKPOINTS</text>
  <text x="90" y="472" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="31">Where the row loses context and the team repeats the same review.</text>

  <g transform="rotate(-6 846 264)">
    <rect x="566" y="154" width="578" height="198" rx="18" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="604" y="214" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700">BREAKPOINT 1  /  DECISION NOTE DROPPED</text>
    <text x="604" y="286" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="56">WHY DID IT MOVE?</text>
    <text x="604" y="328" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27">Matched and reviewed, but the row no longer says why it moved forward.</text>
  </g>

  <g transform="rotate(4 840 520)">
    <rect x="534" y="408" width="592" height="214" rx="18" fill="#111111"/>
    <rect x="558" y="432" width="544" height="166" rx="12" fill="#ff6c33"/>
    <text x="596" y="490" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700">BREAKPOINT 2  /  REVIEWER CHECKPOINT LOST</text>
    <text x="596" y="560" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="54">WHO CLEARED IT?</text>
    <text x="596" y="596" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27">Status survived. Reviewer and checkpoint did not.</text>
  </g>

  <g transform="rotate(-5 398 902)">
    <rect x="128" y="778" width="520" height="228" rx="18" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="166" y="840" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700">BREAKPOINT 3  /  REOPEN TRIGGER MISSING</text>
    <text x="166" y="910" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="54">WHAT CHANGED?</text>
    <text x="166" y="950" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="27">The row came back into review, but the change trigger never stayed attached.</text>
  </g>

  <g transform="rotate(5 912 924)">
    <rect x="694" y="794" width="424" height="244" rx="18" fill="#111111"/>
    <rect x="718" y="818" width="376" height="196" rx="12" fill="#ffd34a"/>
    <text x="750" y="876" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="25" font-weight="700">BREAKPOINT 4  /  NEXT OWNER HIDDEN</text>
    <text x="750" y="948" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="52">WHO MOVES NOW?</text>
    <text x="750" y="988" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="25">The row is not handoff-ready if the next owner still has to guess.</text>
  </g>

  <rect x="72" y="1120" width="1110" height="88" fill="#111111"/>
  <text x="98" y="1172" fill="#f6ecdf" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="39">THE CHAIN BREAKS WHEN THE ROW LOSES THE NOTE, THE CHECKPOINT, THE TRIGGER, OR THE NEXT OWNER.</text>
  <text x="98" y="1202" fill="#f6ecdf" font-family="'Arial Narrow', Arial, sans-serif" font-size="22">Diagnostic workflow framing only. Local staging asset. Not approved for external use.</text>
</svg>
