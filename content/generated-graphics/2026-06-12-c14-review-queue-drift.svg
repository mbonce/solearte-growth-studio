<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 05 Review Queue Drift</title>
  <desc id="desc">Internal-only editorial poster showing how review queues drift when reason, owner, and next step are incomplete, using fake rows and founder-gated CTA handling.</desc>
  <rect width="1254" height="1254" fill="#f4efe6"/>
  <rect x="0" y="0" width="340" height="1254" fill="#111111"/>
  <polygon points="218,0 1254,0 1254,312 468,438" fill="#ff5a36"/>
  <circle cx="586" cy="986" r="196" fill="#ffd84f"/>
  <text x="72" y="176" fill="#f4efe6" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="108" letter-spacing="2">REVIEW</text>
  <text x="72" y="272" fill="#f4efe6" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="108" letter-spacing="2">QUEUE</text>
  <text x="72" y="368" fill="#f4efe6" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="108" letter-spacing="2">DRIFT</text>
  <text x="72" y="430" fill="#f4efe6" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Status survives. Context does not.</text>

  <g transform="rotate(-5 744 342)">
    <rect x="446" y="188" width="680" height="226" rx="16" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="482" y="250" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">SUPPLIER BOARD A</text>
    <text x="482" y="322" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="58">IN MOTION</text>
    <text x="482" y="366" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Buy note saved  /  Owner: L. Morgan  /  Next: route to PO prep</text>
  </g>

  <g transform="rotate(4 820 628)">
    <rect x="548" y="454" width="586" height="286" rx="16" fill="#111111"/>
    <rect x="570" y="476" width="542" height="242" rx="12" fill="#ff5a36"/>
    <text x="606" y="540" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">SUPPLIER BOARD B</text>
    <text x="606" y="618" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="62">NEEDS NOTE + OWNER</text>
    <text x="606" y="664" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Reviewed, but the queue no longer preserves why.</text>
    <text x="606" y="700" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Owner: unassigned  /  Next: save reason first</text>
  </g>

  <g transform="rotate(-3 814 954)">
    <rect x="510" y="818" width="492" height="248" rx="16" fill="#fff8ef" stroke="#111111" stroke-width="5"/>
    <text x="542" y="882" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="28" font-weight="700">SUPPLIER BOARD C</text>
    <text x="542" y="952" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="58">STALE REVIEW</text>
    <text x="542" y="998" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">No next step saved. Owner: M. Chen.</text>
    <text x="542" y="1034" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="30">Next: re-open queue.</text>
  </g>

  <text x="356" y="1182" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="42">A REVIEW QUEUE DRIFTS WHEN THE REASON, OWNER, OR NEXT STEP DISAPPEARS AFTER REVIEW.</text>
  <text x="356" y="1212" fill="#111111" font-family="'Arial Narrow', Arial, sans-serif" font-size="22">Fake rows only. Founder-gated CTA. Internal-only staging asset.</text>
</svg>
