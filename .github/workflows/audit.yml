name: Weekly site audit + claims check
on: { schedule: [{ cron: "0 14 * * 1" }], push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
      - run: npm run build
      - run: npm run audit
        continue-on-error: true
