name: WholesaleOps
options:
  bundleIdPrefix: com.wholesaleops
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WholesaleOps:
    type: application
    platform: iOS
    sources:
      - path: WholesaleOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wholesaleops.commandcenter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wholesale-Ops
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
  WholesaleOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WholesaleOpsTests
    dependencies:
      - target: WholesaleOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wholesaleops.commandcenter.tests
  WholesaleOpsMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WholesaleOps
    settings:
      base:
        PRODUCT_NAME: Wholesale-Ops
        PRODUCT_BUNDLE_IDENTIFIER: com.wholesaleops.commandcenter.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wholesale-Ops
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"
  GrowthStudio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrowthStudio
    settings:
      base:
        PRODUCT_NAME: Growth Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.wholesaleops.growthstudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Growth Studio
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
schemes:
  WholesaleOps:
    build:
      targets:
        WholesaleOps: all
        WholesaleOpsTests: [test]
    test:
      targets:
        - WholesaleOpsTests
  WholesaleOpsMac:
    build:
      targets:
        WholesaleOpsMac: all
  GrowthStudio:
    build:
      targets:
        GrowthStudio: all
